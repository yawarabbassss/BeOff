<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield Outline -->
  <path d="M256 32 C340 32 448 68 448 160 C448 316 348 436 256 480 C164 436 64 316 64 160 C64 68 172 32 256 32 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#glowGrad)" 
        stroke-width="8"
        filter="url(#shadow)" />

  <!-- Inner Protective Arc -->
  <path d="M256 72 C320 72 412 100 412 176 C412 296 332 396 256 436 C180 396 100 296 100 176 C100 100 192 72 256 72 Z" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="2" 
        stroke-opacity="0.4" />

  <!-- Power Off / Shield Core Symbol -->
  <!-- Arc -->
  <path d="M200 180 A 90 90 0 1 0 312 180" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="28" 
        stroke-linecap="round" />

  <!-- Vertical Switch Bar -->
  <line x1="256" y1="130" x2="256" y2="230" 
        stroke="url(#accentGrad)" 
        stroke-width="28" 
        stroke-linecap="round" />

  <!-- Protective Core Dot -->
  <circle cx="256" cy="300" r="14" fill="#34D399" />
</svg>
