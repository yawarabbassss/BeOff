name: beoff
description: "BeOff — Privacy, Ad Blocking & Content Protection Application for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.2
  
  # Persistence & Local Database
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Backend & Supabase (Auth, RLS Sync, Remote Config)
  supabase_flutter: ^2.3.4
  
  # Networking & HTTP
  http: ^1.2.0
  dio: ^5.4.1
  
  # UI & Visuals
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  fl_chart: ^0.66.2
  flutter_spinkit: ^5.2.0
  lucide_icons: ^0.257.0
  
  # In-App Protected Webview & Image Manipulation for local classification
  webview_flutter: ^4.7.0
  image: ^4.1.7
  crypto: ^3.0.3
  
  # Animations & Device info
  device_info_plus: ^9.1.2
  package_info_plus: ^5.0.1
  flutter_local_notifications: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/filters/
    - assets/models/
    - .env.example
